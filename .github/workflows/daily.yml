name: 每日盤後更新

on:
  schedule:
    - cron: '35 7 * * 1-5'   # 台北 15:35
    - cron: '30 10 * * 1-5'  # 台北 18:30（補跑：前一次資料不完整或延遲時）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 取出狀態檔（data 分支）
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pandas numpy requests

      - name: 抓資料、算訊號
        run: python scripts/update.py --state data/state.pkl --out site/signals.json

      - name: 存回狀態檔（data 分支只保留最新一版）
        run: |
          cd data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan tmp
          git add -A
          git commit -m "state $(date -u +%F)"
          git branch -D data
          git branch -m data
          git push -f origin data

      - name: 準備網頁
        run: cp -r web/* site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
