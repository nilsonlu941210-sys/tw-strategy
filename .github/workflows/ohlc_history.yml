name: 研究-下載歷史開高低收
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['research/ohlc_download.py']
permissions:
  contents: write
jobs:
  year:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        year: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests pandas
      - run: python research/ohlc_download.py ${{ matrix.year }} 2>&1 | tee log_${{ matrix.year }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ohlc-${{ matrix.year }}
          path: |
            ohlc_${{ matrix.year }}.csv.gz
            log_${{ matrix.year }}.txt
  merge:
    needs: year
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: parts, merge-multiple: true}
      - name: 存到 ohlc-data 分支
        run: |
          git clone -q --depth 1 -b ohlc-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out || (mkdir out && cd out && git init -q && git checkout -q -b ohlc-data)
          cp parts/* out/ && cd out && ls -la
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "歷史開高低收 $(date -u +%F)"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ohlc-data
